name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/redfur-forge.jks"
            printf "storeFile=%s/redfur-forge.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "${{ runner.temp }}" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
            echo "Configured release signing from repository secrets."
          else
            echo "Release signing secrets not set; release build will fall back to debug keystore."
          fi

      - name: Run unit tests and assemble release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: redfur-forge-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk

      - name: Publish tagged GitHub Release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "${{ runner.temp }}/release-assets"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-universal.apk"
          ARM_SHA=$(sha256sum "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-arm64-v8a.apk" | awk '{print $1}')
          UNI_SHA=$(sha256sum "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-universal.apk" | awk '{print $1}')
          NOTES_FILE="${{ runner.temp }}/release-assets/notes.md"
          CHECKSUM_BLOCK=$(printf "### SHA-256 Checksums\n- \`redfur-forge-%s-arm64-v8a.apk\`: \`%s\`\n- \`redfur-forge-%s-universal.apk\`: \`%s\`\n" \
            "$TAG" "$ARM_SHA" "$TAG" "$UNI_SHA")
          printf "## Redfur Forge %s\n\n%s\n" "$TAG" "$CHECKSUM_BLOCK" > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-arm64-v8a.apk" \
              "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-universal.apk" \
              --clobber
            EXISTING_BODY=$(gh release view "$TAG" --json body -q .body || true)
            MERGED_NOTES="${{ runner.temp }}/release-assets/merged_notes.md"
            EXISTING_BODY="$EXISTING_BODY" CHECKSUM_BLOCK="$CHECKSUM_BLOCK" python3 - "$MERGED_NOTES" <<'PY'
          import os, re, sys

          existing = os.environ.get("EXISTING_BODY", "").replace("\r\n", "\n").strip()
          block = os.environ.get("CHECKSUM_BLOCK", "").strip()
          # Replace any existing SHA-256 Checksums section while preserving all other release notes
          stripped = re.sub(
              r"(?ms)^###\s+SHA-256 Checksums\b.*?(?=^##+\s|\Z)",
              "",
              existing,
          ).strip()
          merged = f"{stripped}\n\n{block}\n" if stripped else f"{block}\n"
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              fh.write(merged)
          PY
            gh release edit "$TAG" --notes-file "$MERGED_NOTES"
          else
            gh release create "$TAG" \
              "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-arm64-v8a.apk" \
              "${{ runner.temp }}/release-assets/redfur-forge-${TAG}-universal.apk" \
              --title "Redfur Forge ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
